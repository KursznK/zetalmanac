name: CI

on:
  pull_request:
  push:
    branches: [main]

# Hak akses minimum: workflow hanya boleh MEMBACA isi repo.
permissions:
  contents: read

# Kalau ada push baru ke branch yang sama, batalkan run lama yang masih berjalan.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies (persis sesuai uv.lock)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/package.json
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies (persis sesuai package-lock.json)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
