    [1] wiki-en-mesoamerican-long-count-calendar › Mesoamerican Long Count calendar › 2012 and the Long Count
    Long Count. If the completion date of that piktun—13 October 4772—were to be written out in Long Count notation, it could be represented as 1.0.0.0.0.0. The 80th CR anniversary date, eight days later, would be 1.0.0.0.0.8 5 Lamat 1 Mol. Despite the publicity generated by the 2012 date, Susan Milbrath, curator of Latin American Art and Archaeology at the Florida Museum of Natural History, stated that "We have no record or knowledge that [the Maya] would think the world would come to an end" in 2012. USA Today writes "'For the ancient Maya, it was a huge celebration to make it to the end of a whole cycle,' says Sandra Noble, executive director of the Foundation for the Advancement of Mesoamerican Studies in Crystal River, Florida. To render December 21, 2012, as a doomsday event or moment of cosmic shifting, she says, is 'a complete fabrication and a chance for a lot of people to cash in.'" "There will be another cycle," says E. Wyllys Andrews V, director of the Tulane University Middle American Research Institute (MARI). "We know the Maya thought there was one before this, and that implies they were comfortable with the idea of another one after this."
