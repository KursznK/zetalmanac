- id: qwen3.8-27b/a09/3
  model: qwen/qwen3.8-27b
  pertanyaan: Bagaimana bulan kabisat ditentukan dalam kalender China?
  klaim: Aturan penentuan tanggal Imlek juga dipengaruhi oleh adanya bulan kabisat; jika tahun sebelumnya
    memiliki bulan kabisat 11 atau 12, maka Imlek tidak lagi tepat pada bulan baru kedua setelah Dongzhi
    sebelumnya [5].
  sitasi:
  - 5
  bukti:
  - |-
    [5] wiki-en-chinese-calendar › Chinese calendar › Holidays › Chinese New Year
    The date of the Chinese New Year accords with the patterns of the lunisolar calendar and hence is variable from year to year. The invariant between years is that the winter solstice, Dongzhi is required to be in the eleventh month of the year This means that Chinese New Year will be on the second new moon after the previous winter solstice, unless there is a leap month 11 or 12 in the previous year. This rule is accurate; however, there are two other mostly (but not completely) accurate rules that are commonly stated: The new year is on the new moon closest to Lichun (typically 4 February). The new year is on the first new moon after Dahan (typically 20 January) It has been found that Chinese New Year moves back by either 10, 11, or 12 days in most years. If it falls on or before 31 January, then it moves forward in the next year by either 18, 19, or 20 days.
  label: didukung
  sitasi_tepat: ya
  catatan: "Pengecualian untuk bulan kabisat 11 atau 12 disebutkan eksplisit."
- id: qwen3.8-27b/a10/1
  model: qwen/qwen3.8-27b
  pertanyaan: Berapa lama satu siklus Calendar Round pada kalender Maya?
  klaim: Satu siklus Calendar Round pada kalender Maya berlangsung selama 18.980 hari, yang setara dengan
    52 tahun Haab' [1][2].
  sitasi:
  - 1
  - 2
  bukti:
  - |-
    [1] wiki-en-maya-calendar › Maya calendar › Calendar Round
    A Calendar Round date is a date that gives both the Tzolkʼin and Haabʼ. This date will repeat after 52 Haabʼ years or 18,980 days, a Calendar Round. For example, the current creation started on 4 Ahau 8 Kumkʼu. When this date recurs it is known as a Calendar Round completion. Arithmetically, the duration of the Calendar Round is the least common multiple of 260 and 365; 18,980 is 73 × 260 Tzolkʼin days and 52 × 365 Haabʼ days. Not every possible combination of Tzolkʼin and Haabʼ can occur. For Tzolkʼin days Imix, Kimi, Chuwen and Kibʼ, the Haabʼ day can only be 4, 9, 14 or 19; for Ikʼ, Manikʼ, Ebʼ and Kabʼan, the Haabʼ day can only be 0, 5, 10 or 15; for Akbʼalʼ, Lamat, Bʼen and Etzʼnabʼ, the Haabʼ day can only be 1, 6, 11 or 16; for Kʼan, Muluk, Ix and Kawak, the Haabʼ day can only be 2, 7, 12 or 17; and for Chikchan, Ok, Men and Ajaw, the Haabʼ day can only be 3, 8, 13 or 18.
  - |-
    [2] wiki-en-maya-calendar › Maya calendar › Overview
    The Maya calendar consists of several cycles or counts of different lengths. The 260-day count is known to scholars as the Tzolkin, or Tzolkʼin. The Tzolkin was combined with a 365-day vague solar year known as the Haabʼ to form a synchronized cycle lasting for 52 Haabʼ called the Calendar Round. The Calendar Round is still in use by many groups in the Guatemalan highlands.
  label: didukung
  sitasi_tepat: ya
  catatan: "Durasi 18.980 hari dan 52 tahun Haab tercantum."
