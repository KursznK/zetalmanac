  bukti:
  - |-
    [1] wiki-en-gregorian-calendar › Gregorian calendar
    years is that every year divisible by four is a leap year, except for years that are divisible by 100 but not also divisible by 400. For example, 1800 and 1900 were not leap years, but 1600 and 2000 were. There were two reasons to establish the Gregorian calendar. First, the Julian calendar was based on the estimate that the average solar year is exactly 365.25 days long, an overestimate of a little under one day per century, and thus has a leap year every four years without exception. The Gregorian reform shortened the average (calendar) year by 0.0075 days to stop the drift of the calendar with respect to the equinoxes. Second, in the years since the First Council of Nicaea in AD 325, the excess leap days introduced by the Julian algorithm had caused the calendar to drift such that the March equinox was occurring well before its nominal 21 March date. This date was important to the Christian churches because it is fundamental to the calculation of the date of Easter. To reinstate the association, the reform advanced the date by 10 days: Thursday 4 October 1582 was followed by Friday 15 October 1582. In addition, the reform also altered the lunar cycle used by the Church to calculate the date for Easter, because astronomical new moons were occurring four days before the calculated dates.
  - |-
    [4] wiki-en-gregorian-calendar › Gregorian calendar
    The Gregorian calendar is the calendar currently used in most parts of the world. It went into effect in October 1582 following the papal bull Inter gravissimas issued by Pope Gregory XIII, which introduced it as a modification of, and replacement for, the Julian calendar. The principal change was to space leap years slightly differently to make the average calendar year 365+97⁄400, or 365.2425, days long rather than the Julian calendar's 365+1⁄4 days, thus more closely approximating the 365.2422-day tropical, or solar, year that is determined by the Earth's revolution around the Sun. The rule for leap years is that every year divisible by four is a leap year, except for years that are divisible by 100 but not also divisible by 400. For example, 1800 and 1900 were not leap years, but 1600 and 2000 were.
