    Rukyat adalah aktivitas mengamati visibilitas hilal, yakni mengamati penampakan bulan sabit yang pertama kali tampak setelah bulan baru (ijtima). Rukyat dapat dilakukan dengan mata telanjang, atau dengan alat bantu optik seperti teleskop. Apabila hilal terlihat, maka pada petang tersebut telah memasuki tanggal 1. Sedangkan hisab adalah melakukan perhitungan untuk menentukan posisi bulan secara matematis dan astronomis. Hisab merupakan alat bantu untuk mengetahui kapan dan di mana hilal (bulan sabit pertama setelah bulan baru) dapat terlihat. Hisab sering kali dilakukan untuk membantu sebelum melakukan rukyat. Penentuan awal bulan menjadi sangat signifikan untuk bulan-bulan yang berkaitan dengan ibadah, seperti bulan Ramadan (yakni umat Islam menjalankan puasa ramadan sebulan penuh), Syawal (yakni umat Islam merayakan Hari Raya Idul Fitri), serta Dzulhijjah (di mana terdapat tanggal yang berkaitan dengan ibadah Haji dan Hari Raya Idul Adha). Penentuan kapan hilal dapat terlihat, menjadi motivasi ketertarikan umat Islam dalam astronomi. Ini menjadi salah satu pendorong mengapa Islam menjadi salah satu pengembang awal ilmu astronomi sebagai sains, lepas dari astrologi pada Abad Pertengahan. Sebagian umat Islam berpendapat bahwa untuk menentukan awal bulan, adalah harus dengan benar-benar melakukan pengamatan hilal secara langsung (rukyatul hilal). Sebagian yang lain berpendapat bahwa penentuan awal bulan cukup dengan melakukan hisab (perhitungan matematis), tanpa harus benar-benar mengamati hilal. Metode hisab juga memiliki berbagai kriteria penentuan, sehingga sering kali menyebabkan perbedaan penentuan awal bulan, yang berakibat adanya perbedaan hari melaksanakan ibadah seperti puasa Ramadan atau Hari Raya Idul Fitri.
  label: didukung
  sitasi_tepat: ya
  catatan: "Perbedaan pandangan tersebut disebutkan eksplisit."
