    [1] wiki-en-gregorian-calendar › Gregorian calendar
    October 1582 was followed by Friday 15 October 1582. In addition, the reform also altered the lunar cycle used by the Church to calculate the date for Easter, because astronomical new moons were occurring four days before the calculated dates. The reform was adopted initially by the Catholic countries of Europe and their overseas possessions. Over the next three centuries, the Protestant and Eastern Orthodox countries also gradually moved to what they called the "Improved calendar", with Greece being the last European country to adopt the calendar (for civil use only) in 1923. However, many Orthodox churches continue to use the Julian calendar for religious rites and the dating of major feasts. To unambiguously specify a date during the transition period (in contemporary documents or in history texts), both notations were given, tagged as "Old Style" or "New Style" as appropriate. During the 20th century, most non-Western countries also adopted the calendar, at least for civil purposes.
  - |-
