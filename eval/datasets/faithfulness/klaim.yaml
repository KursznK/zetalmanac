    [1] wiki-en-chinese-calendar › Chinese calendar › Year-numbering systems › Epochs
    An epoch is a point in time chosen as the origin of a particular calendar era, thus serving as a reference point from which subsequent time or dates are measured. The use of epochs in Chinese calendar system allow for a chronological starting point from whence to begin point continuously numbering subsequent dates. Various epochs have been used. Similarly, nomenclature similar to that of the Christian era has occasionally been used: No reference date is universally accepted. The most popular is the Gregorian calendar (公曆; 公历; gōnglì; 'common calendar'). During the 17th century, the Jesuit missionaries tried to determine the epochal year of the Chinese calendar. In his Sinicae historiae decas prima (published in Munich in 1658), Martino Martini (1614–1661) dated the Yellow Emperor's ascension at 2697 BCE and began the Chinese calendar with the reign of Fuxi (which, according to Martini, began in 2952 BCE). Philippe Couplet's 1686 Chronological table of Chinese monarchs (Tabula chronologica monarchiae sinicae) gave the same date for the Yellow Emperor. The Jesuits' dates provoked interest in Europe, where they were used for comparison with Biblical chronology. Modern Chinese chronology has generally accepted Martini's dates, except that it usually places the reign of the Yellow Emperor at 2698 BCE and omits his predecessors Fuxi and Shennong as "too legendary to include".
