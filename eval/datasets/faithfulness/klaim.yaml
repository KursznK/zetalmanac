- id: gpt-oss-120b/a12/3
  model: openai/gpt-oss-120b
  pertanyaan: Apa perbedaan hisab dan rukyat dalam menentukan awal bulan Hijriah?
  klaim: Jika hilal tidak terlihat pada hari ke‐29, bulan dapat diperpanjang menjadi 30 hari, keputusan
    ini dapat didasarkan pada hasil rukyat atau hisab yang dipilih [2][3].
  sitasi:
  - 2
  - 3
  bukti:
  - |-
    [2] wiki-id-kalender-hijriah › Kalender Hijriah › Sejarah
    Penentuan dimulainya sebuah hari dan tanggal pada Kalender hijriah berbeda dengan Kalender Masehi. Pada sistem Kalender Masehi, sebuah hari dan tanggal dimulai pada pukul 00.00 dini hari waktu setempat. Namun pada sistem Kalender Hijriah, sebuah hari dan tanggal dimulai ketika terbenamnya matahari di tempat tersebut atau ketika memasuki waktu Maghrib. Kalender hijriah dibangun berdasarkan rata-rata siklus sinodik bulan kalender lunar (qomariyah), memiliki 12 bulan dalam setahun. Dengan menggunakan siklus sinodik bulan, bilangan hari dalam satu tahunnya adalah (12 x 29,53059 hari = 354,36708 hari).Hal inilah yang menjelaskan 1 tahun Kalender Hijriah lebih pendek 10-12 hari dibanding dengan 1 tahun Kalender Masehi. Faktanya, siklus sinodik bulan bervariasi. Jumlah hari dalam satu bulan dalam Kalender Hijriah bergantung pada posisi bulan, bumi dan matahari. Usia bulan yang mencapai 30 hari bersesuaian dengan terjadinya bulan baru (new moon) di titik apooge, yaitu jarak terjauh antara bulan dan bumi, dan pada saat yang bersamaan, bumi berada pada jarak terdekatnya dengan matahari (perihelion). Sementara itu, satu bulan yang berlangsung 29 hari bertepatan dengan saat terjadinya bulan baru di perige (jarak terdekat bulan dengan bumi) dengan bumi berada di titik terjauhnya dari Matahari (aphelion). Dari sini terlihat bahwa usia bulan tidak tetap melainkan berubah-ubah (29 – 30 hari) sesuai dengan kedudukan ketiga benda langit tersebut (bulan, bumi dan matahari). Penentuan awal bulan (new moon) ditandai dengan munculnya penampakan (visibilitas) Bulan Sabit pertama kali (hilal) setelah bulan baru (konjungsi atau ijtimak). Pada fase ini, Bulan terbenam sesaat setelah terbenamnya Matahari, sehingga posisi hilal berada di ufuk barat. Jika hilal tidak dapat terlihat pada hari ke-29, maka jumlah hari pada bulan tersebut dibulatkan menjadi 30 hari. Tidak ada aturan khusus bulan-bulan mana saja yang memiliki 29 hari, dan mana yang memiliki 30 hari. Semuanya tergantung pada penampakan hilal.
  - |-
    [3] wiki-id-kalender-hijriah › Kalender Hijriah › Sejarah
    Jika hilal tidak dapat terlihat pada hari ke-29, maka jumlah hari pada bulan tersebut dibulatkan menjadi 30 hari. Tidak ada aturan khusus bulan-bulan mana saja yang memiliki 29 hari, dan mana yang memiliki 30 hari. Semuanya tergantung pada penampakan hilal. Penetapan kalender hijriah dilakukan pada zaman Khalifah Rasyidin kedua, Umar bin Khatab, yang menetapkan bahwa tahun pertama hijriah adalah tahun di mana Muhammad bermigrasi (hijrah) dari Makkah menuju Madinah. Kalender hijriah juga terdiri dari 12 bulan, dengan jumlah hari berkisar 29-30 hari. Penetapan 12 bulan ini disesuaikan dengan teks al-Qur'an, Sesungguhnya bilangan bulan pada sisi Allah ialah dua belas bulan, dalam ketetapan Allah pada waktu Dia menciptakan langit dan bumi, di antaranya empat bulan haram. Itulah (ketetapan) agama yang lurus, maka janganlah kamu menganiaya diri kamu dalam bulan yang empat itu, dan perangilah kaum musyrikin itu semuanya sebagaimana mereka pun memerangi kamu semuanya; dan ketahuilah bahwasanya Allah beserta orang-orang yang bertakwa.
  label: sebagian
  sitasi_tepat: tidak
  catatan: "Pembulatan menjadi 30 hari jika hilal tidak terlihat pada hari ke-29 dinyatakan dalam [2] dan [3]. Tambahan bahwa keputusan ini dapat didasarkan pada hisab yang dipilih tidak didukung kedua kutipan tersebut."
