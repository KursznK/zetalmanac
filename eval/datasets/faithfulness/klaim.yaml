    According to the Popol Vuh, a book compiling details of creation accounts known to the Kʼicheʼ Maya of the Colonial-era highlands, humankind lives in the fourth world. The Popol Vuh describes the first three creations that the gods failed in making and the creation of the successful fourth world where men were placed. In the Maya Long Count, the previous creation ended at the end of a 13th bʼakʼtun. The previous creation ended on a Long Count of 12.19.19.17.19. Another 12.19.19.17.19 occurred on December 20, 2012 (Gregorian Calendar), followed by the start of the 14th bʼakʼtun, 13.0.0.0.0, on December 21, 2012. There are only two references to the current creation's 13th bʼakʼtun in the fragmentary Mayan corpus: Tortuguero Monument 6, part of a ruler's inscription and the recently discovered La Corona Hieroglyphic Stairway 2, Block V. Maya inscriptions occasionally reference future predicted events or commemorations that would occur on dates that lie beyond 2012 (that is, beyond the completion of the 13th bʼakʼtun of the current era). Most of these are in the form of "distance dates" where some Long Count date is given, together with a Distance Number that is to be added to the Long Count date to arrive at this future date. For example, on the west panel at the Temple of Inscriptions in Palenque, a section of the text projects into the future to the 80th Calendar Round (CR) 'anniversary' of the famous Palenque ruler Kʼinich Janaabʼ Pakal's accession to the throne (Pakal's accession occurred on a Calendar Round date 5 Lamat 1 Mol, at Long Count 9.9.2.4.8 equivalent to 27 July 615 CE in the proleptic Gregorian calendar). It does this by commencing with Pakal's birthdate 9.8.9.13.0 8 Ajaw 13 Pop (24 March 603 CE Gregorian) and adding to it the Distance Number 10.11.10.5.8.
