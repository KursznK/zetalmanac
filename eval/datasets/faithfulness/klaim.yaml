    - 4 Okt 1582 (Julian) + 1 hari = 15 Okt 1582 (Gregorian). - 5 Nov 2026 (Gregorian) = 23 Okt 2026 (Julian), JDN 2461350. - JD 2451545,0 = 1 Jan 2000 pukul 12.00 (J2000). - 1 Juni 250: Julian dan Gregorian sama.
