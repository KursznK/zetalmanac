- id: gpt-oss-120b/a08/2
  model: openai/gpt-oss-120b
  pertanyaan: Why are some century years not leap years in the Gregorian calendar?
  klaim: 'It keeps the rule “every year divisible by 4 is a leap year” but adds an exception: years divisible
    by 100 are *not* leap years unless they are also divisible by 400 [4][1].'
  sitasi:
  - 1
  - 4
  bukti:
  - |-
    [1] wiki-en-gregorian-calendar › Gregorian calendar
    years is that every year divisible by four is a leap year, except for years that are divisible by 100 but not also divisible by 400. For example, 1800 and 1900 were not leap years, but 1600 and 2000 were. There were two reasons to establish the Gregorian calendar. First, the Julian calendar was based on the estimate that the average solar year is exactly 365.25 days long, an overestimate of a little under one day per century, and thus has a leap year every four years without exception. The Gregorian reform shortened the average (calendar) year by 0.0075 days to stop the drift of the calendar with respect to the equinoxes. Second, in the years since the First Council of Nicaea in AD 325, the excess leap days introduced by the Julian algorithm had caused the calendar to drift such that the March equinox was occurring well before its nominal 21 March date. This date was important to the Christian churches because it is fundamental to the calculation of the date of Easter. To reinstate the association, the reform advanced the date by 10 days: Thursday 4 October 1582 was followed by Friday 15 October 1582. In addition, the reform also altered the lunar cycle used by the Church to calculate the date for Easter, because astronomical new moons were occurring four days before the calculated dates.
  - |-
    [4] wiki-en-gregorian-calendar › Gregorian calendar
    The Gregorian calendar is the calendar currently used in most parts of the world. It went into effect in October 1582 following the papal bull Inter gravissimas issued by Pope Gregory XIII, which introduced it as a modification of, and replacement for, the Julian calendar. The principal change was to space leap years slightly differently to make the average calendar year 365+97⁄400, or 365.2425, days long rather than the Julian calendar's 365+1⁄4 days, thus more closely approximating the 365.2422-day tropical, or solar, year that is determined by the Earth's revolution around the Sun. The rule for leap years is that every year divisible by four is a leap year, except for years that are divisible by 100 but not also divisible by 400. For example, 1800 and 1900 were not leap years, but 1600 and 2000 were.
  label: didukung
  sitasi_tepat: ya
  catatan: "Aturan habis dibagi 4, pengecualian habis dibagi 100, dan pengecualian atas pengecualian untuk 400 tercantum dalam kedua sumber."
- id: gpt-oss-120b/a08/3
  model: openai/gpt-oss-120b
  pertanyaan: Why are some century years not leap years in the Gregorian calendar?
  klaim: This omission of three leap days every 400 years reduces the average year length to 365 + 97⁄400
    days (≈365.2425 days), matching the solar year more closely and preventing the seasonal drift that
    occurred under the Julian system.
  sitasi: []
  bukti: []
  label: tidak_didukung
  sitasi_tepat: null
  catatan: "Bukti pada entri ini kosong. Rumus rata-rata tahun dan akibatnya merupakan klaim faktual; bukti dari entri lain tidak dipindahkan."
- id: gpt-oss-120b/a09/1
  model: openai/gpt-oss-120b
  pertanyaan: Bagaimana bulan kabisat ditentukan dalam kalender China?
  klaim: Dalam kalender China, bulan kabisat (intercalary month) ditambahkan bila diperlukan untuk menjaga
    agar kalender lunisolarnya tetap selaras dengan musim; bulan ini dimasukkan secara fleksibel sehingga
    total bulan dalam tahun menjadi 13 bila fase bulan dan posisi matahari mengindikasikan bahwa tahun
    tersebut akan jatuh di belakang siklus musiman [3].
  sitasi:
  - 3
  bukti:
  - |-
    [3] wiki-en-chinese-calendar › Chinese calendar
    The Chinese calendar is a lunisolar calendar created by or commonly used by the Chinese people. A total of 102 calendars have been officially recorded in classical historical texts. In addition, many more calendars were created privately, with others being built by people who adapted Chinese cultural practices, such as the Koreans, Japanese, Vietnamese, and many others, over the course of a long history. A Chinese calendar consists of twelve months, each aligned with the phases of the moon, along with an extra intercalary month inserted as needed to keep the calendar in sync with the seasons. It also features twenty-four solar terms, which track the position of the sun and are closely related to climate patterns. Among these, the winter solstice is the most significant reference point and must occur in the eleventh month of the year. Each month contains either twenty-nine or thirty days. The sexagenary cycle for each day runs continuously over thousands of years and serves as a determining factor to pinpoint a specific day amidst the many variations in the calendar. The variety of calendars arises from deviations in algorithms and assumptions about inputs. The Chinese calendar is location-sensitive, meaning that calculations based on different locations, such as Beijing and Nanjing, can yield different results. While modern China primarily adopts the Gregorian calendar for official purposes, the traditional calendar remains culturally significant, influencing festivals and cultural practices, determining the timing of Chinese New Year with traditions like the twelve animals of the Chinese zodiac still widely observed. The winter solstice serves as another New Year, a tradition inherited from ancient China. Beyond China, it has shaped other East Asian calendars, including the Korean, Vietnamese, and Japanese lunisolar systems, each adapting the same lunisolar principles while integrating local customs and terminology.
  label: sebagian
  sitasi_tepat: tidak
  catatan: "Sumber mendukung tujuan menjaga keselarasan musim serta 12 bulan ditambah satu bulan kabisat. Namun, rumusan syarat bahwa fase bulan dan posisi Matahari mengindikasikan tahun akan tertinggal dari siklus musiman tidak diberikan sebagai aturan penentuan dalam kutipan; bagian ini melampaui dukungan sumber."
- id: gpt-oss-120b/a10/1
  model: openai/gpt-oss-120b
  pertanyaan: Berapa lama satu siklus Calendar Round pada kalender Maya?
  klaim: Siklus Calendar Round pada kalender Maya berlangsung selama **18 980 hari**, yaitu kira‐kira
    **52 tahun Haab**[1][2].
  sitasi:
  - 1
  - 2
  bukti:
  - |-
    [1] wiki-en-maya-calendar › Maya calendar › Calendar Round
    A Calendar Round date is a date that gives both the Tzolkʼin and Haabʼ. This date will repeat after 52 Haabʼ years or 18,980 days, a Calendar Round. For example, the current creation started on 4 Ahau 8 Kumkʼu. When this date recurs it is known as a Calendar Round completion. Arithmetically, the duration of the Calendar Round is the least common multiple of 260 and 365; 18,980 is 73 × 260 Tzolkʼin days and 52 × 365 Haabʼ days. Not every possible combination of Tzolkʼin and Haabʼ can occur. For Tzolkʼin days Imix, Kimi, Chuwen and Kibʼ, the Haabʼ day can only be 4, 9, 14 or 19; for Ikʼ, Manikʼ, Ebʼ and Kabʼan, the Haabʼ day can only be 0, 5, 10 or 15; for Akbʼalʼ, Lamat, Bʼen and Etzʼnabʼ, the Haabʼ day can only be 1, 6, 11 or 16; for Kʼan, Muluk, Ix and Kawak, the Haabʼ day can only be 2, 7, 12 or 17; and for Chikchan, Ok, Men and Ajaw, the Haabʼ day can only be 3, 8, 13 or 18.
  - |-
    [2] wiki-en-maya-calendar › Maya calendar › Overview
    The Maya calendar consists of several cycles or counts of different lengths. The 260-day count is known to scholars as the Tzolkin, or Tzolkʼin. The Tzolkin was combined with a 365-day vague solar year known as the Haabʼ to form a synchronized cycle lasting for 52 Haabʼ called the Calendar Round. The Calendar Round is still in use by many groups in the Guatemalan highlands.
  label: didukung
  sitasi_tepat: ya
  catatan: "Durasi 18.980 hari dan 52 tahun Haab didukung kedua sumber. Kesetaraannya tepat, sehingga kata kira-kira tidak diperlukan tetapi tidak mengubah nilai yang didukung."
- id: gpt-oss-120b/a11/1
  model: openai/gpt-oss-120b
  pertanyaan: Apa itu Julian Day Number dan kapan titik nolnya?
  klaim: Julian Day Number (JDN) adalah hitungan berkelanjutan hari sejak awal periode Julian, yang dipakai
    terutama oleh astronomi untuk menghitung selisih hari antara dua peristiwa [1].
  sitasi:
  - 1
  bukti:
  - |-
    [1] wiki-en-julian-day › Julian day
    The Julian day is a continuous count of days from the beginning of the Julian period; it is used primarily by astronomers, and in software for easily calculating elapsed days between two events (e.g., food production date and expiration date). The Julian period is a chronological interval of 7980 years, derived from three multi-year cycles: the indiction, solar, and lunar cycles. The last year that was simultaneously the beginning of all three cycles was 4713 BC (−4712), so that is year 1 of the current Julian period, making AD 2026 year 6739 of that Period. The next Julian period begins in the year AD 3268. Historians used the period to identify Julian calendar years within which an event occurred when no such year was given in the historical record, or when the year given by previous historians was incorrect. The Julian day number (JDN) has the same epoch as the Julian period, but counts the number of days since the epoch rather than the number of years since then. Specifically, Julian day number 0 is assigned to the day starting at noon Universal Time on Monday, 1 January 4713 BC, proleptic Julian calendar (24 November 4714 BC, in the proleptic Gregorian calendar). For example, the Julian day number for the day starting at 12:00 UT (noon) on 1 January 2000, was 2451545. The Julian date (JD) of any instant is the Julian day number plus the fraction of a day since the preceding noon in Universal Time. Julian dates are expressed as a Julian day number with a decimal fraction added. For example, the Julian Date for 00:30:00.0 UT 1 January 2013, is 2456293.520833. This article was loaded at 2026-11-05 21:31:08 (UTC) – expressed as a Julian date this is 2461350.3966204.
  label: didukung
  sitasi_tepat: ya
  catatan: "Definisi dan penggunaan hitungan hari didukung sumber. JDN adalah hitungan hari bulat; JD dapat mencakup pecahan hari."
