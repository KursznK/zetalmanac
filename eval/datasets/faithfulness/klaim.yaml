    years is that every year divisible by four is a leap year, except for years that are divisible by 100 but not also divisible by 400. For example, 1800 and 1900 were not leap years, but 1600 and 2000 were. There were two reasons to establish the Gregorian calendar. First, the Julian calendar was based on the estimate that the average solar year is exactly 365.25 days long, an overestimate of a little under one day per century, and thus has a leap year every four years without exception. The Gregorian reform shortened the average (calendar) year by 0.0075 days to stop the drift of the calendar with respect to the equinoxes. Second, in the years since the First Council of Nicaea in AD 325, the excess leap days introduced by the Julian algorithm had caused the calendar to drift such that the March equinox was occurring well before its nominal 21 March date. This date was important to the Christian churches because it is fundamental to the calculation of the date of Easter. To reinstate the association, the reform advanced the date by 10 days: Thursday 4 October 1582 was followed by Friday 15 October 1582. In addition, the reform also altered the lunar cycle used by the Church to calculate the date for Easter, because astronomical new moons were occurring four days before the calculated dates.
  - |-
    [3] wiki-en-julian-calendar › Julian calendar › Julian reform › Year length; leap years
    The Julian calendar has two types of year: "normal" years of 365 days and "leap" years of 366 days. There is a simple cycle of three "normal" years followed by a leap year and this pattern repeats forever without exception. The Julian year is, therefore, on average 365.25 days long. Consequently, the Julian year drifts over time with respect to the tropical (solar) year (365.24217 days). Although Greek astronomers had known, at least since Hipparchus, a century before the Julian reform, that the tropical year was slightly shorter than 365.25 days, the calendar did not compensate for this difference. As a result, the calendar year gains about three days every four centuries compared to observed equinox times and the seasons. This discrepancy was largely corrected by the Gregorian reform of 1582. The Gregorian calendar has the same months and month lengths as the Julian calendar, but, in the Gregorian calendar, year numbers evenly divisible by 100 are not leap years, except that those evenly divisible by 400 remain leap years (even then, the Gregorian calendar diverges from astronomical observations by one day in 3,030 years).
  - |-
    [4] wiki-en-gregorian-calendar › Gregorian calendar
    The Gregorian calendar is the calendar currently used in most parts of the world. It went into effect in October 1582 following the papal bull Inter gravissimas issued by Pope Gregory XIII, which introduced it as a modification of, and replacement for, the Julian calendar. The principal change was to space leap years slightly differently to make the average calendar year 365+97⁄400, or 365.2425, days long rather than the Julian calendar's 365+1⁄4 days, thus more closely approximating the 365.2422-day tropical, or solar, year that is determined by the Earth's revolution around the Sun. The rule for leap years is that every year divisible by four is a leap year, except for years that are divisible by 100 but not also divisible by 400. For example, 1800 and 1900 were not leap years, but 1600 and 2000 were.
  label: sebagian
  sitasi_tepat: tidak
  catatan: "Aturan dan rata-rata 365,2425 hari didukung. Namun, prevents drifting terlalu mutlak; sumber [3] menyebut masih ada penyimpangan, sedangkan sumber [1] menyatakan tujuan koreksi."
- id: qwen3.8-27b/a09/1
  model: qwen/qwen3.8-27b
  pertanyaan: Bagaimana bulan kabisat ditentukan dalam kalender China?
  klaim: Bulan kabisat (intercalary month) disisipkan ke dalam kalender China yang lunisolar untuk menjaga
    agar kalender tetap selaras dengan musim [3].
  sitasi:
  - 3
  bukti:
  - |-
    [3] wiki-en-chinese-calendar › Chinese calendar
    The Chinese calendar is a lunisolar calendar created by or commonly used by the Chinese people. A total of 102 calendars have been officially recorded in classical historical texts. In addition, many more calendars were created privately, with others being built by people who adapted Chinese cultural practices, such as the Koreans, Japanese, Vietnamese, and many others, over the course of a long history. A Chinese calendar consists of twelve months, each aligned with the phases of the moon, along with an extra intercalary month inserted as needed to keep the calendar in sync with the seasons. It also features twenty-four solar terms, which track the position of the sun and are closely related to climate patterns. Among these, the winter solstice is the most significant reference point and must occur in the eleventh month of the year. Each month contains either twenty-nine or thirty days. The sexagenary cycle for each day runs continuously over thousands of years and serves as a determining factor to pinpoint a specific day amidst the many variations in the calendar. The variety of calendars arises from deviations in algorithms and assumptions about inputs. The Chinese calendar is location-sensitive, meaning that calculations based on different locations, such as Beijing and Nanjing, can yield different results. While modern China primarily adopts the Gregorian calendar for official purposes, the traditional calendar remains culturally significant, influencing festivals and cultural practices, determining the timing of Chinese New Year with traditions like the twelve animals of the Chinese zodiac still widely observed. The winter solstice serves as another New Year, a tradition inherited from ancient China. Beyond China, it has shaped other East Asian calendars, including the Korean, Vietnamese, and Japanese lunisolar systems, each adapting the same lunisolar principles while integrating local customs and terminology.
  label: didukung
  sitasi_tepat: ya
  catatan: "Tujuan penyisipan bulan kabisat disebutkan eksplisit."
