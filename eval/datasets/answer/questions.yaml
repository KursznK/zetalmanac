# Dataset evaluasi jawaban (Sesi 4.5). Tiga jenis:
#   konversi : LLM wajib memanggil tool konversi_tanggal dengan argumen `tool`, dan jawabannya
#              memuat salah satu teks di `harus_memuat` (teks itu dicek otomatis ada di hasil tool).
#   fakta    : jawaban tidak menolak, sitasinya sah, minimal satu sitasi menunjuk potongan di
#              `relevan` (aturan cocok sama dengan eval retrieval), dan memuat salah satu `harus_memuat`.
#   tolak    : pertanyaan di luar sumber; LLM harus menandai [TIDAK_DITEMUKAN].
# `harus_memuat` dicocokkan tanpa membedakan huruf besar/kecil. Tanggal dan teks yang memuat koma
# atau angka ditulis dalam tanda kutip supaya YAML tidak memecah atau mengubah tipenya.

# --- konversi ---
- id: a01
  jenis: konversi
  pertanyaan: 1 Ramadan 1448 H jatuh pada tanggal berapa Masehi?
  tool: {kalender: hijri, tanggal: "1448-09-01"}
  harus_memuat: ["8 Februari 2027", "February 8, 2027", "8 February 2027"]
- id: a02
  jenis: konversi
  pertanyaan: Tanggal 17 Agustus 1945 bertepatan dengan tanggal berapa dalam kalender Hijriah?
  tool: {kalender: gregorian, tanggal: "1945-08-17"}
  harus_memuat: [8 Ramadan 1364]
- id: a03
  jenis: konversi
  pertanyaan: What is the Maya Long Count date for 21 December 2012?
  tool: {kalender: gregorian, tanggal: "2012-12-21"}
  harus_memuat: [13.0.0.0.0]
- id: a04
  jenis: konversi
  pertanyaan: Tahun Baru Imlek 2027 jatuh pada tanggal berapa Masehi?
  tool: {kalender: china, tanggal: "2027-01-01"}
  harus_memuat: [6 Februari 2027]
- id: a05
  jenis: konversi
  pertanyaan: Tanggal 4 Oktober 1582 kalender Julian sama dengan tanggal berapa di kalender Gregorian?
  tool: {kalender: julian, tanggal: "1582-10-04"}
  harus_memuat: [14 Oktober 1582]
- id: a06
  jenis: konversi
  pertanyaan: Tanggal 1 Januari 2000 jatuh pada hari apa?
  tool: {kalender: gregorian, tanggal: "2000-01-01"}
  harus_memuat: [Sabtu]
- id: a17
  jenis: konversi
  # Ditambahkan 7 Nov 2026: tanggal ini (dan hasilnya) tidak ada di korpus, jadi hanya bisa
  # dijawab lewat tool. Jawaban a01 dan a03 ternyata tercantum di korpus (lihat jawaban-tinjauan.md).
  pertanyaan: Tanggal 17 Maret 1987 bertepatan dengan tanggal berapa dalam kalender Hijriah?
  tool: {kalender: gregorian, tanggal: "1987-03-17"}
  harus_memuat: [16 Rajab 1407]

# --- fakta ---
- id: a07
  jenis: fakta
  pertanyaan: Apa beda epoch sipil dan astronomis pada kalender Hijriah urfi?
  relevan:
    - {doc: spec-hijri-urfi, section: Parameter}
  harus_memuat: [16 Juli, 15 Juli]
- id: a08
  jenis: fakta
  pertanyaan: Why are some century years not leap years in the Gregorian calendar?
  relevan:
    - {doc: wiki-en-gregorian-calendar, section: (intro)}
    - {doc: wiki-en-gregorian-calendar, section: Description}
    - {doc: spec-gregorian, section: Aturan}
  harus_memuat: ["400"]
- id: a09
  jenis: fakta
  pertanyaan: Bagaimana bulan kabisat ditentukan dalam kalender China?
  relevan:
    - {doc: spec-china, section: Aturan (pasca-1645)}
    - {doc: wiki-en-chinese-calendar, section: Solar year and solar terms}
  harus_memuat: [zhongqi, major term, major solar term, 中气, 中氣]
- id: a10
  jenis: fakta
  pertanyaan: Berapa lama satu siklus Calendar Round pada kalender Maya?
  relevan:
    - {doc: wiki-en-maya-calendar, section: Calendar Round}
    - {doc: wiki-en-maya-calendar, section: Overview}
    - {doc: wiki-id-kalender-maya, section: Jenis-jenis Kalender Maya}
  harus_memuat: ["18.980", "18,980", "18980", "52"]
- id: a11
  jenis: fakta
  pertanyaan: Apa itu Julian Day Number dan kapan titik nolnya?
  relevan:
    - {doc: wiki-en-julian-day, section: (intro)}
    - {doc: spec-julian, section: JD dan JDN}
  harus_memuat: ["4713"]
- id: a12
  jenis: fakta
  pertanyaan: Apa perbedaan hisab dan rukyat dalam menentukan awal bulan Hijriah?
  relevan:
    - {doc: wiki-id-kalender-hijriah, section: Hisab dan Rukyat}
  harus_memuat: [hilal]

