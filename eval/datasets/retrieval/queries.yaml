# Dataset evaluasi retrieval Zetalmanac (Sesi 4.3).
# Setiap kueri punya daftar target relevan: dokumen (doc) dan, bila perlu, bagian (section).
#   section: judul bagian UTUH, dicocokkan dari ujung jejak judul. "Calendar Round" cocok dengan
#     "Maya calendar › Calendar Round", tetapi tidak dengan sub-bagian "… › Calendar Round › Year Bearer".
#     "(intro)" = bagian pembuka dokumen. Tanpa section = bagian mana pun dari dokumen itu.
# Kategori (id / en / lintas) TIDAK ditulis manual: dihitung dari bahasa kueri dan bahasa dokumen target.
# Aturan label: hanya bagian yang benar-benar MENJAWAB pertanyaan, bukan yang sekadar menyebut istilahnya.
# Label diusulkan, lalu WAJIB diperiksa manusia sebelum dipakai mengambil keputusan.
#
# Catatan mutu korpus (ditemukan saat memeriksa label, 6 Nov 2026):
#   tabel dan rumus Wikipedia hilang/rusak di ekstrak teks polos, jadi bagian ini TIDAK dijadikan label:
#   wiki-id-kalender-hijriah "Nama-nama bulan" (tabel), wiki-id-kalender-tionghoa "Rumus tahun kabisat"
#   dan "Tahun Baru Imlek" (tabel), wiki-en-julian-day "Converting Gregorian calendar date to Julian
#   day number" (garis pecahan hilang), wiki-en-mesoamerican-long-count-calendar "Long Count periods"
#   (tabel satuan hilang).

