# --- Kueri tambahan dari Zaky ---
- id: q34
  query: mengapa calendar round berisi 52 tahun haab dan jarang dinyatakan sebagai 73 tahun tzolkin
  lang: id
  relevan:
    # Korpus memberi 18.980 = 52 × 365 = 73 × 260, tetapi tidak menjelaskan eksplisit "mengapa jarang 73".
    - {doc: wiki-en-maya-calendar, section: Calendar Round}
    - {doc: wiki-id-kalender-maya, section: Jenis-jenis Kalender Maya}
