[project]
name = "zetalmanac-rag"
version = "0.1.0"
description = "Korpus, ingestion, dan retrieval untuk asisten Zetalmanac"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
