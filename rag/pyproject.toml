[project]
name = "zetalmanac-rag"
version = "0.1.0"
description = "Korpus, ingestion, dan retrieval untuk asisten Zetalmanac"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "snowballstemmer>=2.2",
    "zetalmanac-core",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Tata letak datar: paket zrag/ langsung di folder rag/ (bukan src/zrag/).
module-name = "zrag"
module-root = ""

[tool.uv.sources]
zetalmanac-core = { path = "../packages/zetalmanac-core", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
