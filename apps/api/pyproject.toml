[project]
name = "zetalmanac-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kurszn", email = "290027529+KursznK@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "zetalmanac-core",
    "zetalmanac-rag",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.uv.sources]
zetalmanac-core = { path = "../../packages/zetalmanac-core", editable = true }
zetalmanac-rag = { path = "../../rag", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
